<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Anteprima dell'app con dati di prova</title>
<!--
  Pagina di prova del restyling: va aperta dal server di sviluppo
  (npm run dev, poi http://localhost:5173/design/strumenti/anteprima-app.html).
  Riempie il database locale con i dati di mockup.html (agosto e settembre 2026,
  un budget, una regola) e mostra l'app in due riquadri da 393 px, chiaro e scuro.
  ATTENZIONE: SOSTITUISCE i movimenti del database di questo browser su questa origine.
  Parametri: ?mese=2026-09 (mese mostrato), ?pagina=movimenti|categorie, ?altezza=852.
-->
<style>
  body { margin: 0; background: #555; font: 14px system-ui; color: #fff; }
  .coppia { display: flex; gap: 24px; padding: 16px; align-items: flex-start; }
  figure { margin: 0; } figcaption { margin: 0 0 6px; font-weight: 700; }
  iframe { width: 393px; border: 0; background: #fff; display: block; }
  #stato { padding: 10px 16px 0; }
</style>
</head>
<body>
<p id="stato">Preparo i dati…</p>
<div class="coppia">
  <figure><figcaption>Chiaro</figcaption><iframe id="chiaro" title="App, tema chiaro"></iframe></figure>
  <figure><figcaption>Scuro</figcaption><iframe id="scuro" title="App, tema scuro"></iframe></figure>
</div>
<script type="module">
  const q = new URLSearchParams(location.search)
  const mese = q.get('mese') ?? '2026-09'
  const pagina = q.get('pagina') ?? ''
  const altezza = q.get('altezza') ?? '2400'
  const stato = document.getElementById('stato')

  // settembre fino al 22 e agosto intero, in centesimi (mockup.html)
  const SETT = [0, 1840, 0, 41200, 990, 13120, 0, 4460, 1290, 0, 12750, 0, 16320, 880, 0, 11301, 4880, 5850, 6640, 0, 2589, 4320]
  const AGO = [0, 3000, 2000, 40000, 3500, 0, 10500, 1800, 0, 12500, 2500, 6000, 0, 16000, 3000, 0, 4500, 7000, 2200, 0, 6500, 17040, 4000, 0, 8500, 2500, 5000, 0, 7000, 3000, 4500]
  const NOMI = { spesa: ['Conad', 'Lidl', 'Esselunga'], affitto: ['Affitto'], trasporti: ['Trenitalia', 'ATM'], svago: ['Netflix', 'Pizzeria da Michele', 'Bar Centrale'],
    bollette: ['Enel'], salute: ['Farmacia'], casa: ['Ikea'] }
  const giro = ['spesa', 'trasporti', 'svago', 'spesa', 'salute', 'svago', 'casa', 'spesa', 'bollette']

  function movimenti(anno, m, giorni) {
    const out = []
    giorni.forEach((v, i) => {
      if (!v) return
      const data = `${anno}-${String(m).padStart(2, '0')}-${String(i + 1).padStart(2, '0')}`
      // il 4 c'è l'affitto: 400 euro, il resto è spesa
      if (v >= 40000) out.push({ cat: 'affitto', v: 40000, data }), (v -= 40000)
      if (!v) return
      const cat = giro[(i * 7 + m) % giro.length]
      out.push({ cat, v, data })
    })
    return out.map((x, k) => ({ id: crypto.randomUUID(), tipo: 'uscita', importo: x.v, categoriaId: x.cat, data: x.data,
      descrizione: NOMI[x.cat][k % NOMI[x.cat].length], creatoIl: `${x.data}T12:00:00.000Z`, origine: 'manuale' }))
  }

  const apri = () => new Promise((ok, ko) => { const r = indexedDB.open('spese'); r.onsuccess = () => ok(r.result); r.onerror = () => ko(r.error) })
  const carica = (el, url) => new Promise((ok) => { el.onload = ok; el.src = url })

  // 1. il primo avvio dell'app crea il database e semina le categorie
  const chiaro = document.getElementById('chiaro'), scuro = document.getElementById('scuro')
  chiaro.style.height = scuro.style.height = altezza + 'px'
  await carica(chiaro, '/')
  await new Promise((r) => setTimeout(r, 800))

  // 2. i dati di prova
  const db = await apri()
  const tx = db.transaction(['movimenti', 'categorie', 'regole'], 'readwrite')
  tx.objectStore('movimenti').clear()
  for (const m of [...movimenti(2026, 9, SETT), ...movimenti(2026, 8, AGO)]) tx.objectStore('movimenti').put(m)
  for (const [g, d] of [[20, '2026-09-20'], [20, '2026-08-20']]) tx.objectStore('movimenti').put({ id: crypto.randomUUID(), tipo: 'entrata', importo: 150000, categoriaId: 'stipendio', data: d, descrizione: 'Stipendio', creatoIl: d + 'T09:00:00.000Z', origine: 'manuale' })
  const cat = tx.objectStore('categorie')
  const spesa = await new Promise((r) => { const q = cat.get('spesa'); q.onsuccess = () => r(q.result) })
  cat.put({ ...spesa, budget: 45000 })
  const svago = await new Promise((r) => { const q = cat.get('svago'); q.onsuccess = () => r(q.result) })
  cat.put({ ...svago, budget: 15000 })
  tx.objectStore('regole').put({ id: 'prova-conad', contiene: 'conad', categoriaId: 'spesa', priorita: 1 })
  await new Promise((r) => (tx.oncomplete = r))
  db.close()

  // 3. i due temi: la scelta sta in localStorage, letta all'avvio di ogni riquadro
  const url = `/${pagina}?mese=${mese}`
  localStorage.setItem('spese.tema', 'chiaro')
  await carica(chiaro, url)
  localStorage.setItem('spese.tema', 'scuro')
  await carica(scuro, url)
  // rete di sicurezza: in Chrome headless il riquadro chiaro segue a volte il tema del sistema
  await new Promise((r) => setTimeout(r, 600))
  chiaro.contentDocument.documentElement.classList.remove('dark')
  scuro.contentDocument.documentElement.classList.add('dark')
  stato.textContent = `Dati di prova caricati: ${mese}, pagina "${pagina || 'report'}".`
  document.title = 'pronto'
</script>
</body>
</html>
