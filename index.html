<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Spese</title>
    <meta name="description" content="Entrate e uscite del mese, a colpo d'occhio." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Spese" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F3F4F0" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#15181F" />
    <script>
      // Applica il tema prima del primo render per evitare il lampo bianco/nero.
      try {
        var t = localStorage.getItem('spese.tema');
        var scuro = t === 'scuro' || (t !== 'chiaro' && matchMedia('(prefers-color-scheme: dark)').matches);
        if (scuro) document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
